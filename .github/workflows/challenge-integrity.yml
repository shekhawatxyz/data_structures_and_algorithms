name: Challenge Integrity

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify challenge progress markers
        run: python3 challenges/validate_progress_markers.py
      - name: Verify prompt blocks and tests exist
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roots = [
              Path("challenges/linked_list_challenges"),
              Path("challenges/stacks_challenges"),
          ]

          failures = []
          for root in roots:
              for path in sorted(root.glob("level_*/*.py")):
                  text = path.read_text(encoding="utf-8")
                  if "Complete Exact Problem Statement" not in text:
                      failures.append(f"{path}: missing full question block")
                  if "def test_" not in text:
                      failures.append(f"{path}: missing tests")

          if failures:
              print("\n".join(failures))
              raise SystemExit(1)
          PY
